[project]
name = "curso-core"
version = "0.1.0"
description = "Librería compartida del curso: cliente LLM con tracing, métricas y utilidades."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
