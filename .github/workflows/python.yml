name: Python

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: requirements.txt al día con uv.lock
        run: uv export --format requirements-txt --no-hashes -o requirements.txt && git diff --exit-code requirements.txt
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
