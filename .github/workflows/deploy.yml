name: Despliegue

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # ID público de Umami (Settings > Secrets and variables > Actions > Variables).
    # Si no existe, la compilación no incluye el script de analítica.
    env:
      UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          path: site
          node-version: 26

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
