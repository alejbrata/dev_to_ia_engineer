# Proveedores alternativos para CURSO_PROVEEDOR. Con `CURSO_PROVEEDOR=openai`, cualquier
# práctica que pida el rol de la izquierda recibe el de la derecha, sin tocar el código.
# Los roles que no aparecen (el reranker, los de comparar embeddings...) siguen siendo
# los locales. Para cambios más finos, CURSO_ROLES (que tiene prioridad).

[alternativas.openai]
# chat_grande y razonador van al modelo barato: el intermedio no admite herramientas en
# /chat/completions ni desactivar el razonamiento. Las prácticas que comparan chat con
# chat_grande comparan el mismo modelo consigo mismo.
chat = "chat_openai"
chat_pequeno = "chat_openai"
chat_grande = "chat_openai"
razonador = "chat_openai"
agente = "chat_openai"
judge = "chat_openai_grande"
embeddings = "embeddings_openai"

[alternativas.hf]
chat = "chat_hf"
chat_pequeno = "chat_hf"
chat_grande = "chat_hf"
razonador = "chat_hf"
agente = "chat_hf"
judge = "chat_hf"
embeddings = "embeddings_hf"

[alternativas.claude]
# Claude no ofrece embeddings: el rol embeddings sigue siendo el local.
chat = "chat_claude"
chat_pequeno = "chat_claude"
chat_grande = "chat_claude"
razonador = "chat_claude"
agente = "chat_claude"
judge = "chat_claude"
