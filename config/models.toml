# Nombres de modelos del curso.
#
# Es el único sitio donde aparecen: ni el texto de las lecciones ni el código de las
# prácticas los escriben a mano. Cambian cada pocos meses; cuando lo hagan, se
# actualiza este fichero y nada más.
#
# Estructura:
#   [roles.<rol>]        qué modelo usa cada tarea del curso.
#     provider           clave de una sección [providers.<nombre>].
#     model              identificador exacto del modelo en ese proveedor.
#     hf_repo            opcional: repositorio en Hugging Face (ficha y tokenizador).
#   [providers.<nombre>] datos del proveedor. Las claves API van en .env, nunca aquí.
#     tipo               dialecto de la API: "ollama" (nativo) u "openai" (compatible
#                        con OpenAI: OpenAI, Hugging Face, vLLM, llama.cpp...).
#     base_url           URL base de la API.
#     api_key_env        opcional: nombre de la variable de entorno con la clave.
#   [precios."<proveedor>/<modelo>"] USD por millón de tokens de entrada y de salida.
#                        Sin entrada en esta tabla, el coste de la llamada es desconocido.

[roles.chat]
# Modelo general para generación y conversación.
# Por defecto, un modelo pequeño y abierto servido en local con Ollama.
# Descárgalo con `ollama pull <model>`. Revisado: 2026-10.
provider = "ollama"
model = "qwen2.5:1.5b"
hf_repo = "Qwen/Qwen2.5-1.5B-Instruct"

[roles.chat_pequeno]
# Modelos de la misma familia en tamaños distintos, para compararlos en la lección 05
# del módulo 1. Revisado: 2026-10.
provider = "ollama"
model = "qwen2.5:0.5b"
hf_repo = "Qwen/Qwen2.5-0.5B-Instruct"

[roles.chat_grande]
provider = "ollama"
model = "qwen2.5:7b"
hf_repo = "Qwen/Qwen2.5-7B-Instruct"

[roles.chat_compatible]
# El mismo modelo local, pero hablando el dialecto compatible con OpenAI que Ollama
# expone en /v1. Lo usa la lección 04 del módulo 1 para comparar APIs.
provider = "ollama_compatible"
model = "qwen2.5:1.5b"

[roles.chat_llamacpp]
# El mismo modelo servido por llama-server (llama.cpp), compatible con OpenAI.
# Arráncalo con: llama-server -hf Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M -c 4096 --port 8081
provider = "llamacpp"
model = "Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M"

[roles.simulador]
# Un proveedor de mentira con límite de uso (modulos/01-fundamentos-de-llms/simulador.py),
# para provocar errores 429 en la lección 06 del módulo 1. No es un modelo.
provider = "simulador"
model = "simulador"

[roles.remoto]
# Un modelo servido por un proveedor en la nube vía Hugging Face Inference Providers.
# Necesita HF_TOKEN y créditos en la cuenta. Revisado: 2026-10.
provider = "huggingface"
model = "Qwen/Qwen3-4B-Instruct-2507"
hf_repo = "Qwen/Qwen3-4B-Instruct-2507"

[roles.agente]
# Modelo para los agentes del módulo 5: encadenan muchas llamadas con herramientas, y los
# modelos más pequeños se equivocan con ellas. Elegido midiendo en la lección 02 del
# módulo 5. Razona antes de responder si no se desactiva (Opciones.razonar).
# Descárgalo con `ollama pull <model>` (~5 GB). Revisado: 2026-10.
provider = "ollama"
model = "qwen3:8b"
hf_repo = "Qwen/Qwen3-8B"

[roles.chat_openai]
# Opcional (anexo G): una API comercial, para quien quiera comparar con el modelo local o
# necesite más calidad. Necesita OPENAI_API_KEY en .env y saldo en la cuenta. El modelo
# barato de OpenAI; cualquier práctica lo usa si cambias su rol a este. Revisado: 2026-10.
provider = "openai"
model = "gpt-6-luna"

[roles.chat_openai_grande]
# Opcional (anexo G): el modelo intermedio de OpenAI en coste y capacidad. Revisado: 2026-10.
provider = "openai"
model = "gpt-6.1-sol"

[roles.chat_claude]
# Opcional (anexos A y G): Claude con el SDK oficial de Anthropic. Necesita
# ANTHROPIC_API_KEY en .env y saldo en la cuenta. Alternativas más baratas:
# "claude-sonnet-5-5" o "claude-haiku-5-5" (añade su precio abajo). Revisado: 2026-10.
provider = "anthropic"
model = "claude-opus-5-5"

[roles.judge]
# Modelo que hace de juez en las evals (LLM-as-judge): uno más grande que el que
# genera las respuestas. Revisado: 2026-10.
provider = "ollama"
model = "qwen2.5:7b"
hf_repo = "Qwen/Qwen2.5-7B-Instruct"

[roles.embeddings]
# Modelo de embeddings para RAG. Debe ser el mismo al indexar y al consultar.
# Multilingüe (el corpus del curso está en español). Revisado: 2026-10.
provider = "ollama"
model = "bge-m3"
hf_repo = "BAAI/bge-m3"

[roles.embeddings_otro]
# Otro modelo de embeddings con las mismas dimensiones que bge-m3 (1024), para ver en la
# lección 03 del módulo 3 qué pasa al consultar un índice con un modelo distinto.
# Revisado: 2026-10.
provider = "ollama"
model = "qwen3-embedding:0.6b"
hf_repo = "Qwen/Qwen3-Embedding-0.6B"

[roles.reranker]
# Modelo de reranking (cross-encoder) servido por llama-server. Revisado: 2026-10.
# Arráncalo con:
# llama-server -hf gpustack/bge-reranker-v2-m3-GGUF:Q8_0 --reranking --port 8082
provider = "llamacpp_rerank"
model = "gpustack/bge-reranker-v2-m3-GGUF:Q8_0"
hf_repo = "BAAI/bge-reranker-v2-m3"

[roles.embeddings_ingles]
# Un modelo de embeddings entrenado sobre todo en inglés, para comparar en la lección 03
# del módulo 3. Revisado: 2026-10.
provider = "ollama"
model = "nomic-embed-text"
hf_repo = "nomic-ai/nomic-embed-text-v1.5"

[providers.ollama]
# Servidor local de Ollama. No necesita clave.
# 127.0.0.1 y no localhost: en algunos sistemas (Windows, sobre todo), localhost intenta
# primero IPv6 y cada conexión tarda segundos (lección 06 del módulo 1).
tipo = "ollama"
base_url = "http://127.0.0.1:11434"

[providers.ollama_compatible]
# El mismo servidor de Ollama, con su API compatible con OpenAI.
tipo = "openai"
base_url = "http://127.0.0.1:11434/v1"

[providers.llamacpp]
# Servidor local de llama.cpp (llama-server). No necesita clave.
tipo = "openai"
base_url = "http://127.0.0.1:8081/v1"

[providers.llamacpp_rerank]
# Otro llama-server, con el modelo de reranking (endpoint /v1/rerank).
tipo = "openai"
base_url = "http://127.0.0.1:8082/v1"

[providers.simulador]
tipo = "openai"
base_url = "http://127.0.0.1:8099/v1"

[providers.huggingface]
# Hugging Face Inference Providers. Necesita HF_TOKEN y créditos en la cuenta:
# las cuentas gratuitas no incluyen créditos mensuales. Revisado: 2026-10.
tipo = "openai"
base_url = "https://router.huggingface.co/v1"
api_key_env = "HF_TOKEN"

[providers.openai]
# Opcional (anexo G). La API de OpenAI pide `max_completion_tokens` en lugar de
# `max_tokens`, y sus modelos actuales solo aceptan la temperatura por defecto: con
# temperature=0 responden 400; y su salida estructurada estricta exige el esquema cerrado.
# Revisado: 2026-10.
tipo = "openai"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
parametro_max_tokens = "max_completion_tokens"
omitir = ["temperature"]
esquema_estricto = true

[providers.anthropic]
# Opcional (anexo A). No usa el formato de OpenAI: curso_core lo llama con el SDK oficial,
# sin temperatura (la API actual rechaza los parámetros de muestreo). Revisado: 2026-10.
tipo = "anthropic"
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"

[precios."ollama/qwen2.5:1.5b"]
# En local no se paga por token: el coste es tu hardware y tu electricidad.
entrada = 0.0
salida = 0.0

