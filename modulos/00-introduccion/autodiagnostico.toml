# Autodiagnóstico de la lección 01 ("La rotación").
#
# Puntúa cada habilidad de 0 a 3:
#   0 = nunca lo he hecho
#   1 = lo he visto o lo he hecho siguiendo un tutorial
#   2 = lo hago, pero con ayuda o consultando a menudo
#   3 = lo hago solo y sabría explicarlo
#
# Después ejecuta, desde la raíz del repo:
#   uv run python modulos/00-introduccion/autodiagnostico.py
#
# Repítelo al terminar cada módulo. Si lo versionas en tu fork, `git log -p` sobre
# este fichero es tu registro de progreso.

