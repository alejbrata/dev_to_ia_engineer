[project]
name = "curso-ai-engineering"
version = "0.1.0"
description = "Curso abierto de AI Engineering: prácticas y librería compartida."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "curso-core",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "openai>=3.41.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "tokenizers>=0.23.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
curso-core = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["site"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["packages", "tests", "modulos"]
pythonpath = ["scripts"]
addopts = "--import-mode=importlib"
