[project]
name = "curso-ai-engineering"
version = "0.1.0"
description = "Curso abierto de AI Engineering: prácticas y librería compartida."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "curso-core",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp>=2.3.0",
    "openai>=3.41.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "pdfplumber>=0.11.10",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.1",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "tokenizers>=0.23.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
# Opcional, para el anexo B (Hugging Face): `uv sync --group hf`. Torch pesa mucho, así que
# no entra en la instalación base; se toma del índice de PyTorch para CPU (más ligero).
hf = [
    "datasets>=5.1.0",
    "gradio-client>=2.7.2",
    "peft>=0.21.2",
    "sacremoses>=0.2.0",
    "scikit-learn>=1.9.1",
    "sentencepiece>=0.2.2",
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
curso-core = { workspace = true }
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["site"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["packages", "tests", "modulos"]
pythonpath = ["scripts"]
addopts = "--import-mode=importlib"
